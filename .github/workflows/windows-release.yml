name: Windows release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: luckytoken-windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      LUCKYTOKEN_WINDOWS_CERTIFICATE_FILE: ${{ runner.temp }}\luckytoken.pfx
      LUCKYTOKEN_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use pinned Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts
          npm rebuild electron

      - name: Materialize signing certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PFX_BASE64)) {
            throw "WINDOWS_CERTIFICATE_PFX_BASE64 is required"
          }
          [IO.File]::WriteAllBytes(
            $env:LUCKYTOKEN_WINDOWS_CERTIFICATE_FILE,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64)
          )

      - name: Build, install, and certify the official release
        run: npm run release:windows

      - name: Upload the certified Squirrel release set
        uses: actions/upload-artifact@v7
        with:
          name: luckytoken-windows-release
          path: artifacts/releases/**
          if-no-files-found: error
          compression-level: 0

      - name: Remove signing certificate
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath $env:LUCKYTOKEN_WINDOWS_CERTIFICATE_FILE -Force -ErrorAction SilentlyContinue
